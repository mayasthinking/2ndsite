<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="How the files on mayabakir.com connect.">
    <script src="paper-time.js?v=7"></script>
    <title>how this is built</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" sizes="any">
    <style>
        :root {
            color-scheme: light;
            --paper: #faf9f6;
            --ink: #24211f;
            --hover: #8b2f32;
            --line: rgba(139, 47, 50, 0.2);
            --muted: rgba(36, 33, 31, 0.58);
            --paper-highlight: white;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Libre Baskerville", serif;
            font-size: 15px;
            line-height: 1.62;
        }

        a { color: inherit; text-decoration: none; }

        main {
            width: min(calc(100% - 40px), 1180px);
            margin: 0 auto;
            padding: 48px 0 80px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.65rem;
            font-weight: 400;
        }

        .lead {
            margin: 0 0 36px;
            max-width: 38em;
            color: var(--muted);
        }

        .phrase {
            width: fit-content;
            transition: color 180ms ease;
        }

        .phrase:hover,
        .phrase:focus-visible {
            color: var(--hover);
        }

        .atlas-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 28px;
        }

        @media (min-width: 960px) {
            .atlas-wrap {
                grid-template-columns: minmax(0, 1fr) minmax(260px, 30%);
                align-items: start;
            }
        }

        .diagram-scroll {
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .diagram {
            position: relative;
            min-width: 860px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 36px 18px;
        }

        .edges {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .edge {
            fill: none;
            stroke: color-mix(in srgb, var(--ink) 16%, transparent);
            stroke-width: 1;
            transition: stroke 180ms ease, stroke-width 180ms ease;
        }

        .edge.is-lit {
            stroke: var(--hover);
            stroke-width: 1.4;
        }

        .edge-label {
            fill: var(--muted);
            font-size: 11px;
            font-family: "Libre Baskerville", serif;
            opacity: 0;
            pointer-events: none;
        }

        .edge-label.is-lit {
            fill: var(--hover);
            opacity: 1;
        }

        .node {
            position: relative;
            z-index: 1;
            appearance: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            border: 1px solid var(--line);
            background: color-mix(in srgb, var(--paper) 88%, var(--paper-highlight));
            color: var(--ink);
            font: inherit;
            text-align: left;
            padding: 10px 12px 11px;
            border-radius: 12px;
            cursor: pointer;
            transition: color 180ms ease, border-color 180ms ease, background 180ms ease, opacity 180ms ease;
        }

        .node-name {
            font-size: 0.88rem;
            line-height: 1.3;
            word-break: break-word;
        }

        .node-blurb {
            color: var(--muted);
            font-size: 0.74rem;
            line-height: 1.4;
        }

        .node:hover,
        .node:focus-visible {
            color: var(--hover);
            border-color: color-mix(in srgb, var(--hover) 42%, transparent);
        }

        .node:hover .node-blurb,
        .node:focus-visible .node-blurb,
        .node.is-open .node-blurb,
        .node.is-related .node-blurb {
            color: color-mix(in srgb, var(--hover) 72%, var(--muted));
        }

        .node.is-open,
        .node.is-related {
            color: var(--hover);
            border-color: color-mix(in srgb, var(--hover) 55%, transparent);
            background: color-mix(in srgb, var(--hover) 8%, var(--paper));
        }

        .diagram.is-focused .node:not(.is-open):not(.is-related) {
            opacity: 0.38;
        }

        .dossier {
            min-height: 12rem;
            padding: 4px 2px 0;
        }

        .dossier[hidden] {
            display: none;
        }

        .dossier-kicker {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.72rem;
        }

        .dossier h2 {
            margin: 0 0 6px;
            font-size: 1.05rem;
            font-weight: 400;
            word-break: break-word;
        }

        .dossier-blurb {
            margin: 0 0 12px;
            color: var(--muted);
        }

        .dossier p {
            margin: 0 0 0.85em;
        }

        .connections {
            margin: 0 0 14px;
            padding: 0;
            list-style: none;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .connections li { margin: 0.2em 0; }

        .connections button {
            appearance: none;
            border: 0;
            background: none;
            padding: 0;
            font: inherit;
            color: inherit;
            cursor: pointer;
            transition: color 180ms ease;
        }

        .connections button:hover,
        .connections button:focus-visible {
            color: var(--hover);
        }

        .home {
            display: inline-block;
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 0.8rem;
        }

        @media (max-width: 720px) {
            main { width: min(calc(100% - 28px), 720px); padding-top: 32px; }
        }
    </style>
</head>
<body>
    <main>
        <a class="home phrase" href="index.html">filing cabinet</a>
        <h1 class="phrase">how this is built</h1>
        <p class="lead">a map of what talks to what. lines are loads, fetches, and posts. click a file.</p>

        <div class="atlas-wrap">
            <div class="diagram-scroll">
                <div class="diagram" id="atlas">
                    <svg class="edges" id="edges" aria-hidden="true"></svg>
                </div>
            </div>
            <aside class="dossier" id="dossier" hidden>
                <p class="dossier-kicker">file</p>
                <h2 id="dossierTitle"></h2>
                <div id="dossierBody"></div>
            </aside>
        </div>
    </main>
    <script>
        const files = {
            vercel: {
                title: "vercel.json",
                path: "vercel.json",
                blurb: "hosts the files and the paint api",
                body: `<p>static hosting for every html page. the only extra rules: send <code>/compositions</code> to <code>/compositions/</code>, and give <code>api/generate.mjs</code> sixty seconds.</p>`,
                col: "2 / 4",
                row: 1
            },
            index: {
                title: "index.html",
                path: "index.html",
                blurb: "homepage — photos, bookmarks, little map",
                body: `<p>one html file. after load it fetches the json beside it and builds the carousel, bookmark list, and small map. the lightbox lives here too. footer links go to the studio and the sketchbook.</p>`,
                col: "1 / 3",
                row: 2
            },
            compositions: {
                title: "compositions/index.html",
                path: "compositions/index.html",
                blurb: "watercolor studio page",
                body: `<p>the studio at <code>/compositions/</code>. loads <code>app.js</code> and <code>styles.css</code>, and embeds <code>renderer.html</code> in an iframe.</p>`,
                col: "3 / 5",
                row: 2
            },
            "paper-time": {
                title: "paper-time.js",
                path: "paper-time.js",
                blurb: "tints the paper with the time of day",
                body: `<p>reads your clock and fades the background from morning cream to dusk brown. also sets ink, hover, and stain colors. the homepage and footsteps both load it. try <code>?hour=18</code> or <code>?scheme=dark</code>.</p>`,
                col: "1 / 2",
                row: 3
            },
            snaps: {
                title: "snaps.json",
                path: "snaps.json",
                blurb: "photo album list",
                body: `<p>months, cities, and photo objects. the homepage fetches this and builds the carousel. <code>photos/</code> is the folder the <code>src</code> paths point at.</p>`,
                col: "2 / 3",
                row: 3
            },
            app: {
                title: "compositions/app.js",
                path: "compositions/app.js",
                blurb: "prompt, chips, paint, upload",
                body: `<p>studio controller. posts a scene to <code>/api/generate</code>, gets chips from <code>/api/samples</code>, sends <code>paint()</code> to the iframe, and runs photo washes in a worker.</p>`,
                col: "3 / 4",
                row: 3
            },
            styles: {
                title: "compositions/styles.css",
                path: "compositions/styles.css",
                blurb: "desk, wall, mobile sheet",
                body: `<p>studio layout. same paper / ink / hover as the cabinet, with inter on the controls.</p>`,
                col: "4 / 5",
                row: 3
            },
            bookmarks: {
                title: "bookmarks.json",
                path: "bookmarks.json",
                blurb: "pinned safari links",
                body: `<p>the homepage fetches this, then merges in <code>readings.json</code> (bookmarks first, skip duplicate urls). these stay visible; readings paginate.</p>`,
                col: "1 / 2",
                row: 4
            },
            readings: {
                title: "readings.json",
                path: "readings.json",
                blurb: "notion reading log, in the repo",
                body: `<p>same shape as bookmarks. shown ten at a time after the pinned list.</p>`,
                col: "2 / 3",
                row: 4
            },
            renderer: {
                title: "compositions/renderer.html",
                path: "compositions/renderer.html",
                blurb: "hidden page that draws paintings",
                body: `<p>iframe. <code>renderer.js</code> compiles <code>paint()</code>, draws with p5.brush, and posts a png back. vendor copies are in <code>compositions/vendor/</code>.</p>`,
                col: "3 / 4",
                row: 4
            },
            "image-worker": {
                title: "compositions/image-worker.js",
                path: "compositions/image-worker.js",
                blurb: "turns a photo into wash marks",
                body: `<p>web worker: rasterize, plan marks, encode png. used when you upload a photo instead of typing a scene.</p>`,
                col: "4 / 5",
                row: 4
            },
            places: {
                title: "places.json",
                path: "places.json",
                blurb: "map pins",
                body: `<p>names, lat/lon, regions, photo links. the homepage draws the small svg. footsteps fetches the same file for the full map.</p>`,
                col: "1 / 2",
                row: 5
            },
            photos: {
                title: "photos/",
                path: "photos/",
                blurb: "the jpeg files",
                body: `<p>the images <code>snaps.json</code> points at. the homepage and lightbox load them from here.</p>`,
                col: "2 / 3",
                row: 5
            },
            generate: {
                title: "api/generate.mjs",
                path: "api/generate.mjs",
                blurb: "paint button’s server endpoint",
                body: `<p><code>POST /api/generate</code>. hands the scene to <code>lib/compositions/generate.js</code>.</p>`,
                col: "3 / 4",
                row: 5
            },
            samples: {
                title: "api/samples.mjs",
                path: "api/samples.mjs",
                blurb: "preset chips list",
                body: `<p><code>GET /api/samples</code>. returns the chip list from <code>templates.js</code> — fingerprints, coffee, tree, roses, little prince.</p>`,
                col: "4 / 5",
                row: 5
            },
            footsteps: {
                title: "footsteps.html",
                path: "footsteps.html",
                blurb: "full-page map",
                body: `<p>reads <code>places.json</code> and <code>snaps.json</code>. loads <code>paper-time.js</code> so the paper matches the homepage. back link returns to the cabinet.</p>`,
                col: "1 / 2",
                row: 6
            },
            sketchbook: {
                title: "sketchbook.html",
                path: "sketchbook.html",
                blurb: "notebook cover",
                body: `<p>“enter here” opens <code>desktop.html</code>. also links back to the cabinet. styled by <code>styles.css</code>.</p>`,
                col: "2 / 3",
                row: 6
            },
            "lib-generate": {
                title: "lib/compositions/generate.js",
                path: "lib/compositions/generate.js",
                blurb: "asks a model, or uses a preset",
                body: `<p>if you tapped a chip, it returns that stored <code>paint()</code>. if you typed a scene, it calls grok / anthropic / openai, then keeps only a safe <code>paint()</code> function.</p>`,
                col: "3 / 4",
                row: 6
            },
            prompt: {
                title: "lib/compositions/prompt.js",
                path: "lib/compositions/prompt.js",
                blurb: "instructions for the model",
                body: `<p>the system prompt, the user prompt builder, and the allowed brush names.</p>`,
                col: "4 / 5",
                row: 6
            },
            desktop: {
                title: "desktop.html",
                path: "desktop.html",
                blurb: "windows-98 desktop",
                body: `<p>about window, music player, moodboard. <code>mobile.js</code> makes it one window on a phone. opened from the sketchbook.</p>`,
                col: "2 / 3",
                row: 7
            },
            templates: {
                title: "lib/compositions/templates.js",
                path: "lib/compositions/templates.js",
                blurb: "saved paint() scenes",
                body: `<p>the actual code behind the chips. generate uses it for presets; samples uses it for the chip list.</p>`,
                col: "3 / 4",
                row: 7
            }
        };

        const edges = [
            { from: "vercel", to: "compositions", via: "redirects" },
            { from: "vercel", to: "generate", via: "hosts" },
            { from: "index", to: "paper-time", via: "loads" },
            { from: "index", to: "snaps", via: "fetches" },
            { from: "index", to: "bookmarks", via: "fetches" },
            { from: "index", to: "readings", via: "fetches" },
            { from: "index", to: "places", via: "fetches" },
            { from: "index", to: "compositions", via: "links" },
            { from: "index", to: "sketchbook", via: "links" },
            { from: "snaps", to: "photos", via: "lists" },
            { from: "bookmarks", to: "readings", via: "merged with" },
            { from: "places", to: "footsteps", via: "also read by" },
            { from: "footsteps", to: "paper-time", via: "loads" },
            { from: "footsteps", to: "snaps", via: "fetches" },
            { from: "sketchbook", to: "desktop", via: "opens" },
            { from: "compositions", to: "app", via: "loads" },
            { from: "compositions", to: "styles", via: "loads" },
            { from: "compositions", to: "renderer", via: "embeds" },
            { from: "app", to: "renderer", via: "messages" },
            { from: "app", to: "image-worker", via: "jobs" },
            { from: "app", to: "generate", via: "posts" },
            { from: "app", to: "samples", via: "gets" },
            { from: "generate", to: "lib-generate", via: "calls" },
            { from: "lib-generate", to: "prompt", via: "uses" },
            { from: "lib-generate", to: "templates", via: "uses" },
            { from: "samples", to: "templates", via: "reads" }
        ];

        const aliases = {
            you: "index",
            cabinet: "index",
            rooms: "sketchbook",
            tokens: "paper-time",
            shortcuts: "index",
            worker: "image-worker",
            health: "generate",
            "little-prince": "index",
            stoccato: "index",
            "text-editor": "index",
            "add-photo": "snaps",
            "add-bookmark": "bookmarks",
            "ios-photo": "snaps",
            "ios-bookmark": "bookmarks",
            "docs-photos": "snaps",
            "docs-bookmarks": "bookmarks"
        };

        const atlas = document.getElementById("atlas");
        const edgesSvg = document.getElementById("edges");
        const dossier = document.getElementById("dossier");
        const dossierTitle = document.getElementById("dossierTitle");
        const dossierBody = document.getElementById("dossierBody");
        const buttons = {};

        Object.entries(files).forEach(([id, entry]) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "node";
            button.id = `node-${id}`;
            button.dataset.id = id;
            button.style.gridColumn = entry.col;
            button.style.gridRow = String(entry.row);
            const name = document.createElement("span");
            name.className = "node-name";
            name.textContent = entry.title;
            const blurb = document.createElement("span");
            blurb.className = "node-blurb";
            blurb.textContent = entry.blurb;
            button.append(name, blurb);
            button.addEventListener("click", () => openNode(id));
            buttons[id] = button;
            atlas.append(button);
        });

        function connectionsOf(id) {
            return edges.filter((edge) => edge.from === id || edge.to === id);
        }

        function neighborsOf(id) {
            const next = new Set();
            connectionsOf(id).forEach((edge) => {
                next.add(edge.from === id ? edge.to : edge.from);
            });
            return next;
        }

        function openNode(id) {
            const entry = files[id];
            if (!entry) return;

            const already = buttons[id].classList.contains("is-open");
            Object.values(buttons).forEach((button) => button.classList.remove("is-open", "is-related"));
            edgesSvg.querySelectorAll(".edge, .edge-label").forEach((el) => el.classList.remove("is-lit"));

            if (already) {
                atlas.classList.remove("is-focused");
                dossier.hidden = true;
                history.replaceState(null, "", "architecture.html");
                return;
            }

            atlas.classList.add("is-focused");
            buttons[id].classList.add("is-open");
            neighborsOf(id).forEach((other) => buttons[other]?.classList.add("is-related"));
            edgesSvg.querySelectorAll(".edge, .edge-label").forEach((el) => {
                if (el.dataset.a === id || el.dataset.b === id) el.classList.add("is-lit");
            });

            const links = connectionsOf(id).map((edge) => {
                const other = edge.from === id ? edge.to : edge.from;
                const verb = edge.from === id ? edge.via : `${edge.via} ←`;
                return `<li>${verb} <button type="button" data-jump="${other}">${files[other].path}</button></li>`;
            }).join("");

            dossierTitle.textContent = entry.path;
            dossierBody.innerHTML = `
                <p class="dossier-blurb">${entry.blurb}</p>
                ${entry.body}
                <ul class="connections">${links}</ul>
            `;
            dossierBody.querySelectorAll("[data-jump]").forEach((button) => {
                button.addEventListener("click", () => openNode(button.dataset.jump));
            });
            dossier.hidden = false;
            history.replaceState(null, "", `#${id}`);
            requestAnimationFrame(drawEdges);
        }

        function nodeCenter(id) {
            const button = buttons[id];
            const box = atlas.getBoundingClientRect();
            const node = button.getBoundingClientRect();
            return {
                x: node.left + node.width / 2 - box.left,
                y: node.top + node.height / 2 - box.top
            };
        }

        function drawEdges() {
            const box = atlas.getBoundingClientRect();
            edgesSvg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
            edgesSvg.replaceChildren();
            const open = document.querySelector(".node.is-open");

            edges.forEach((edge) => {
                const from = nodeCenter(edge.from);
                const to = nodeCenter(edge.to);
                const midY = (from.y + to.y) / 2;
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M ${from.x} ${from.y} C ${from.x} ${midY}, ${to.x} ${midY}, ${to.x} ${to.y}`);
                path.setAttribute("class", "edge");
                path.dataset.a = edge.from;
                path.dataset.b = edge.to;
                const lit = open && (open.dataset.id === edge.from || open.dataset.id === edge.to);
                if (lit) path.classList.add("is-lit");

                const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("x", (from.x + to.x) / 2);
                label.setAttribute("y", midY - 6);
                label.setAttribute("text-anchor", "middle");
                label.setAttribute("class", "edge-label");
                label.dataset.a = edge.from;
                label.dataset.b = edge.to;
                label.textContent = edge.via;
                if (lit) label.classList.add("is-lit");

                edgesSvg.append(path, label);
            });
        }

        window.addEventListener("resize", drawEdges);
        requestAnimationFrame(drawEdges);

        const start = aliases[location.hash.slice(1)] || location.hash.slice(1);
        if (files[start]) openNode(start);
        else openNode("index");
    </script>
</body>
</html>
