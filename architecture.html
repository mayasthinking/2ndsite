<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="The files that make mayabakir.com.">
    <script src="paper-time.js?v=7"></script>
    <title>how this is built</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" sizes="any">
    <style>
        :root {
            color-scheme: light;
            --paper: #faf9f6;
            --ink: #24211f;
            --hover: #8b2f32;
            --line: rgba(139, 47, 50, 0.2);
            --muted: rgba(36, 33, 31, 0.58);
            --paper-highlight: white;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Libre Baskerville", serif;
            font-size: 15px;
            line-height: 1.62;
        }

        a { color: inherit; text-decoration: none; }

        main {
            width: min(calc(100% - 40px), 1080px);
            margin: 0 auto;
            padding: 48px 0 80px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.65rem;
            font-weight: 400;
        }

        .lead {
            margin: 0 0 36px;
            max-width: 36em;
            color: var(--muted);
        }

        .phrase {
            width: fit-content;
            transition: color 180ms ease;
        }

        .phrase:hover,
        .phrase:focus-visible {
            color: var(--hover);
        }

        .atlas-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 28px;
        }

        @media (min-width: 860px) {
            .atlas-wrap {
                grid-template-columns: minmax(0, 1fr) minmax(280px, 34%);
                align-items: start;
            }
        }

        .dir {
            margin: 0 0 26px;
        }

        .dir:last-child { margin-bottom: 0; }

        .dir-path {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.03em;
        }

        .dir-files {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
            gap: 10px;
        }

        .node {
            appearance: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            border: 1px solid var(--line);
            background: color-mix(in srgb, var(--paper) 88%, var(--paper-highlight));
            color: var(--ink);
            font: inherit;
            text-align: left;
            padding: 11px 14px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
        }

        .node-name {
            font-size: 0.92rem;
            line-height: 1.3;
        }

        .node-blurb {
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.4;
        }

        .node:hover,
        .node:focus-visible {
            color: var(--hover);
            border-color: color-mix(in srgb, var(--hover) 42%, transparent);
        }

        .node:hover .node-blurb,
        .node:focus-visible .node-blurb,
        .node.is-open .node-blurb,
        .node.is-related .node-blurb {
            color: color-mix(in srgb, var(--hover) 72%, var(--muted));
        }

        .node.is-open,
        .node.is-related {
            color: var(--hover);
            border-color: color-mix(in srgb, var(--hover) 55%, transparent);
            background: color-mix(in srgb, var(--hover) 8%, var(--paper));
        }

        .dossier {
            min-height: 12rem;
            padding: 4px 2px 0;
        }

        .dossier[hidden] {
            display: none;
        }

        .dossier-kicker {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.72rem;
        }

        .dossier h2 {
            margin: 0 0 6px;
            font-size: 1.05rem;
            font-weight: 400;
            word-break: break-word;
        }

        .dossier-blurb {
            margin: 0 0 12px;
            color: var(--muted);
        }

        .dossier p {
            margin: 0 0 0.85em;
        }

        .dossier p:last-child { margin-bottom: 0; }

        .files {
            margin: 0 0 14px;
            padding: 0;
            list-style: none;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .files li { margin: 0.15em 0; }

        .related {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .related button {
            appearance: none;
            border: 0;
            background: none;
            padding: 0;
            font: inherit;
            font-size: 0.88rem;
            color: var(--muted);
            cursor: pointer;
            transition: color 180ms ease;
        }

        .related button:hover,
        .related button:focus-visible {
            color: var(--hover);
        }

        .home {
            display: inline-block;
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 0.8rem;
        }

        @media (max-width: 720px) {
            main { width: min(calc(100% - 28px), 720px); padding-top: 32px; }
            .dir { margin-bottom: 20px; }
        }
    </style>
</head>
<body>
    <main>
        <a class="home phrase" href="index.html">filing cabinet</a>
        <h1 class="phrase">how this is built</h1>
        <p class="lead">this is the repo. each card is a real file or folder, with a line about what it does. click one for more.</p>

        <div class="atlas-wrap">
            <div class="atlas" id="atlas"></div>
            <aside class="dossier" id="dossier" hidden>
                <p class="dossier-kicker">file</p>
                <h2 id="dossierTitle"></h2>
                <div id="dossierBody"></div>
            </aside>
        </div>
    </main>

        const files = {
            index: {

                `,

                blurb: "a ping that the api is up",

                `,

            },
            "lib-generate": {

                `,

                `,

        const atlas = document.getElementById("atlas");
        const dossier = document.getElementById("dossier");
        const dossierTitle = document.getElementById("dossierTitle");
        const dossierBody = document.getElementById("dossierBody");
        const buttons = {};

        tree.forEach((dir) => {
            const block = document.createElement("div");
            block.className = "dir";
            const label = document.createElement("p");
            label.className = "dir-path";
            label.textContent = dir.path;
            const row = document.createElement("div");
            row.className = "dir-files";
            dir.nodes.forEach((id) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "node";
                button.id = `node-${id}`;
                button.dataset.id = id;
                const name = document.createElement("span");
                name.className = "node-name";
                name.textContent = files[id].title;
                const blurb = document.createElement("span");
                blurb.className = "node-blurb";
                blurb.textContent = files[id].blurb;
                button.append(name, blurb);
                button.addEventListener("click", () => openNode(id));
                buttons[id] = button;
                row.append(button);
            });
            block.append(label, row);
            atlas.append(block);
        });

        function openNode(id) {
            const entry = files[id];
            if (!entry) return;

            const already = buttons[id].classList.contains("is-open");
            Object.values(buttons).forEach((button) => button.classList.remove("is-open", "is-related"));

            if (already) {
                dossier.hidden = true;
                history.replaceState(null, "", "architecture.html");
                return;
            }

            buttons[id].classList.add("is-open");
            entry.related.forEach((other) => buttons[other]?.classList.add("is-related"));

            dossierTitle.textContent = entry.path;
            const also = entry.also.length
                ? `<ul class="files">${entry.also.map((file) => `<li>${file}</li>`).join("")}</ul>`
                : "";
            const links = `<div class="related">${entry.related.map((other) =>
                `<button type="button" data-jump="${other}">${files[other].path}</button>`
            ).join("")}</div>`;
            dossierBody.innerHTML = `<p class="dossier-blurb">${entry.blurb}</p>${entry.body}${also}${links}`;
            dossierBody.querySelectorAll("[data-jump]").forEach((button) => {
                button.addEventListener("click", () => openNode(button.dataset.jump));
            });
            dossier.hidden = false;
            history.replaceState(null, "", `#${id}`);
        }

        const start = aliases[location.hash.slice(1)] || location.hash.slice(1);
        if (files[start]) openNode(start);
        else openNode("index");
    </script>
</body>
</html>
