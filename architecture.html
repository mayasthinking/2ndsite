<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="The files that make mayabakir.com.">
    <script src="paper-time.js?v=7"></script>
    <title>how this is built</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" sizes="any">
    <style>
        :root {
            color-scheme: light;
            --paper: #faf9f6;
            --ink: #24211f;
            --hover: #8b2f32;
            --line: rgba(139, 47, 50, 0.2);
            --muted: rgba(36, 33, 31, 0.58);
            --paper-highlight: white;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Libre Baskerville", serif;
            font-size: 15px;
            line-height: 1.62;
        }

        a { color: inherit; text-decoration: none; }

        main {
            width: min(calc(100% - 40px), 1080px);
            margin: 0 auto;
            padding: 48px 0 80px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.65rem;
            font-weight: 400;
        }

        .lead {
            margin: 0 0 36px;
            max-width: 36em;
            color: var(--muted);
        }

        .phrase {
            width: fit-content;
            transition: color 180ms ease;
        }

        .phrase:hover,
        .phrase:focus-visible {
            color: var(--hover);
        }

        .atlas-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 28px;
        }

        @media (min-width: 860px) {
            .atlas-wrap {
                grid-template-columns: minmax(0, 1fr) minmax(280px, 34%);
                align-items: start;
            }
        }

        .dir {
            margin: 0 0 26px;
        }

        .dir:last-child { margin-bottom: 0; }

        .dir-path {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.03em;
        }

        .dir-files {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 10px;
        }

        .node {
            appearance: none;
            border: 1px solid var(--line);
            background: color-mix(in srgb, var(--paper) 88%, var(--paper-highlight));
            color: var(--ink);
            font: inherit;
            font-size: 0.88rem;
            line-height: 1.3;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
        }

        .node:hover,
        .node:focus-visible {
            color: var(--hover);
            border-color: color-mix(in srgb, var(--hover) 42%, transparent);
        }

        .node.is-open,
        .node.is-related {
            color: var(--hover);
            border-color: color-mix(in srgb, var(--hover) 55%, transparent);
            background: color-mix(in srgb, var(--hover) 8%, var(--paper));
        }

        .dossier {
            min-height: 12rem;
            padding: 4px 2px 0;
        }

        .dossier[hidden] {
            display: none;
        }

        .dossier-kicker {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 0.72rem;
        }

        .dossier h2 {
            margin: 0 0 10px;
            font-size: 1.05rem;
            font-weight: 400;
            word-break: break-word;
        }

        .dossier p {
            margin: 0 0 0.85em;
        }

        .dossier p:last-child { margin-bottom: 0; }

        .files {
            margin: 0 0 14px;
            padding: 0;
            list-style: none;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .files li { margin: 0.15em 0; }

        .related {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .related button {
            appearance: none;
            border: 0;
            background: none;
            padding: 0;
            font: inherit;
            font-size: 0.88rem;
            color: var(--muted);
            cursor: pointer;
            transition: color 180ms ease;
        }

        .related button:hover,
        .related button:focus-visible {
            color: var(--hover);
        }

        .home {
            display: inline-block;
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 0.8rem;
        }

        @media (max-width: 720px) {
            main { width: min(calc(100% - 28px), 720px); padding-top: 32px; }
            .dir { margin-bottom: 20px; }
        }
    </style>
</head>
<body>
    <main>
        <a class="home phrase" href="index.html">filing cabinet</a>
        <h1 class="phrase">how this is built</h1>
        <p class="lead">this is the repo. each pill is a real file or folder. click one.</p>

        <div class="atlas-wrap">
            <div class="atlas" id="atlas"></div>
            <aside class="dossier" id="dossier" hidden>
                <p class="dossier-kicker">file</p>
                <h2 id="dossierTitle"></h2>
                <div id="dossierBody"></div>
            </aside>
        </div>
    </main>
    <script>
        const tree = [
            {
                path: "/",
                nodes: [
                    "index", "paper-time", "vercel",
                    "snaps", "photos", "bookmarks", "readings", "places",
                    "sketchbook", "desktop", "footsteps",
                    "little-prince", "stoccato", "text-editor"
                ]
            },
            {
                path: "compositions/",
                nodes: ["compositions", "app", "styles", "renderer", "image-worker"]
            },
            {
                path: "api/",
                nodes: ["generate", "samples", "health"]
            },
            {
                path: "lib/compositions/",
                nodes: ["lib-generate", "prompt", "templates"]
            },
            {
                path: "scripts/",
                nodes: ["add-photo", "add-bookmark"]
            },
            {
                path: "shortcuts/",
                nodes: ["ios-photo", "ios-bookmark"]
            },
            {
                path: "docs/",
                nodes: ["docs-photos", "docs-bookmarks"]
            }
        ];

        const aliases = {
            you: "index",
            cabinet: "index",
            rooms: "sketchbook",
            tokens: "paper-time",
            shortcuts: "add-photo",
            worker: "image-worker"
        };

        const files = {
            index: {
                title: "index.html",
                path: "index.html",
                body: `
                    <p>the homepage. one html file with the photos carousel, bookmarks list, small footsteps map, and footer links. after load it fetches the json files next to it. the lightbox and slider live here too.</p>
                    <p>also in the root, not shown as pills: <code>main.html</code> and <code>mayas-cabinet.html</code> redirect here.</p>
                `,
                also: ["paper-time.js", "snaps.json", "bookmarks.json", "readings.json", "places.json"],
                related: ["paper-time", "snaps", "bookmarks", "places"]
            },
            "paper-time": {
                title: "paper-time.js",
                path: "paper-time.js",
                body: `
                    <p>sets css variables on <code>:root</code> from the local hour: <code>--paper</code>, <code>--ink</code>, <code>--hover</code>, and the rest. loaded by <code>index.html</code> and <code>footsteps.html</code>. remembers light/dark in <code>localStorage</code> as <code>cabinet-scheme</code>.</p>
                `,
                also: ["index.html", "footsteps.html"],
                related: ["index", "footsteps"]
            },
            vercel: {
                title: "vercel.json",
                path: "vercel.json",
                body: `
                    <p>the deploy config. redirects <code>/compositions</code> to <code>/compositions/</code>. gives <code>api/generate.mjs</code> sixty seconds. everything else is just the files in this repo, served as-is. <code>package.json</code> only starts a local <code>http-server</code>.</p>
                `,
                also: ["api/generate.mjs", "api/samples.mjs", "api/health.mjs", "package.json"],
                related: ["generate", "samples", "health", "compositions"]
            },
            snaps: {
                title: "snaps.json",
                path: "snaps.json",
                body: `
                    <p>photo albums. an array of months, each with city groups and photo objects: <code>src</code>, <code>alt</code>, <code>caption</code>. <code>index.html</code> fetches this with <code>cache: "no-store"</code> and builds the carousel. do not put album markup in the html.</p>
                `,
                also: ["photos/", "index.html", "scripts/add_photo.py", "docs/add-photos.md"],
                related: ["photos", "index", "add-photo", "docs-photos"]
            },
            photos: {
                title: "photos/",
                path: "photos/",
                body: `
                    <p>the jpeg files. names look like <code>YYYYMMDD-HHMMSS-xxxx.jpeg</code>. <code>snaps.json</code> points at them. resized before commit by <code>scripts/add_photo.py</code>.</p>
                `,
                also: ["snaps.json", "scripts/add_photo.py"],
                related: ["snaps", "add-photo"]
            },
            bookmarks: {
                title: "bookmarks.json",
                path: "bookmarks.json",
                body: `
                    <p>pinned links from the safari share sheet. <code>index.html</code> merges this with <code>readings.json</code> (bookmarks first, then readings, skip duplicate urls). these stay visible; readings paginate.</p>
                `,
                also: ["readings.json", "index.html", "scripts/add_bookmark.py", "docs/add-bookmarks.md"],
                related: ["readings", "index", "add-bookmark"]
            },
            readings: {
                title: "readings.json",
                path: "readings.json",
                body: `
                    <p>the notion reading log, exported into the repo. same shape as bookmarks. the homepage shows ten at a time after the pinned list.</p>
                `,
                also: ["bookmarks.json", "index.html"],
                related: ["bookmarks", "index"]
            },
            places: {
                title: "places.json",
                path: "places.json",
                body: `
                    <p>map pins: names, lat/lon, regions, and links back to photos. <code>index.html</code> draws the small svg. <code>footsteps.html</code> uses the same file for the full-page map.</p>
                `,
                also: ["index.html", "footsteps.html"],
                related: ["index", "footsteps", "snaps"]
            },
            sketchbook: {
                title: "sketchbook.html",
                path: "sketchbook.html",
                body: `
                    <p>notebook-grid landing. “enter here” goes to <code>desktop.html</code>. styled by <code>styles.css</code>.</p>
                `,
                also: ["desktop.html", "styles.css"],
                related: ["desktop"]
            },
            desktop: {
                title: "desktop.html",
                path: "desktop.html",
                body: `
                    <p>the windows-98 desktop: about window, music player, moodboard. <code>mobile.js</code> turns it into a single-window phone layout when the viewport is small. playlist files are in <code>music/</code>.</p>
                `,
                also: ["styles.css", "mobile.css", "mobile.js", "music/", "sketchbook.html"],
                related: ["sketchbook"]
            },
            footsteps: {
                title: "footsteps.html",
                path: "footsteps.html",
                body: `
                    <p>full-page map. reads <code>places.json</code>. click to drop a pin; openstreetmap nominatim reverse-geocodes it. also loads <code>paper-time.js</code>.</p>
                `,
                also: ["places.json", "paper-time.js"],
                related: ["places", "paper-time", "index"]
            },
            "little-prince": {
                title: "little-prince.html",
                path: "little-prince.html",
                body: `
                    <p>a canvas star-field page. sits in the repo root next to the other html files.</p>
                `,
                also: [],
                related: ["index"]
            },
            stoccato: {
                title: "stoccato.html",
                path: "stoccato.html",
                body: `
                    <p>shared notes. talks to firebase firestore. setup notes are in <code>FIREBASE_SETUP.md</code>.</p>
                `,
                also: ["FIREBASE_SETUP.md"],
                related: ["index"]
            },
            "text-editor": {
                title: "text-editor.html",
                path: "text-editor.html",
                body: `
                    <p>a standalone rich-text page in the repo root.</p>
                `,
                also: [],
                related: ["index"]
            },
            compositions: {
                title: "index.html",
                path: "compositions/index.html",
                body: `
                    <p>the studio page at <code>/compositions/</code>. loads <code>app.js</code> and <code>styles.css</code>, and embeds <code>renderer.html</code> in an iframe.</p>
                `,
                also: ["compositions/app.js", "compositions/styles.css", "compositions/renderer.html"],
                related: ["app", "styles", "renderer", "generate"]
            },
            app: {
                title: "app.js",
                path: "compositions/app.js",
                body: `
                    <p>the studio controller. posts to <code>/api/generate</code>, loads chips from <code>/api/samples</code>, handles photo upload, and messages the renderer iframe. also uses <code>effect-model.js</code>, <code>color.js</code>, and <code>color-dial.js</code>.</p>
                `,
                also: [
                    "compositions/effect-model.js",
                    "compositions/color.js",
                    "compositions/color-dial.js",
                    "compositions/brush-effects.js"
                ],
                related: ["compositions", "renderer", "image-worker", "generate", "samples"]
            },
            styles: {
                title: "styles.css",
                path: "compositions/styles.css",
                body: `
                    <p>studio layout: desk, wall, mobile bottom sheet. same paper / ink / hover colors as the cabinet, with inter on the controls.</p>
                `,
                also: ["compositions/index.html"],
                related: ["compositions", "app"]
            },
            renderer: {
                title: "renderer.html",
                path: "compositions/renderer.html",
                body: `
                    <p>hidden iframe. <code>renderer.js</code> compiles a <code>paint()</code> function, draws it with p5 and p5.brush, and posts a png back to <code>app.js</code>. vendor copies live in <code>compositions/vendor/</code>.</p>
                `,
                also: [
                    "compositions/renderer.js",
                    "compositions/brush-effects.js",
                    "compositions/vendor/p5.min.js",
                    "compositions/vendor/p5.brush.js"
                ],
                related: ["app", "compositions", "generate", "image-worker"]
            },
            "image-worker": {
                title: "image-worker.js",
                path: "compositions/image-worker.js",
                body: `
                    <p>web worker for photo washes. rasterize, plan marks, encode png. <code>image-work.js</code> is the promise wrapper. <code>photo-wash.js</code> and <code>photo-wash-plan.js</code> turn pixels into brush marks.</p>
                `,
                also: [
                    "compositions/image-work.js",
                    "compositions/photo-wash.js",
                    "compositions/photo-wash-plan.js"
                ],
                related: ["app", "renderer"]
            },
            generate: {
                title: "generate.mjs",
                path: "api/generate.mjs",
                body: `
                    <p><code>POST /api/generate</code>. reads <code>{ scene, count, sampleId, effects }</code> and calls <code>generatePaintings()</code> in <code>lib/compositions/generate.js</code>.</p>
                `,
                also: ["lib/compositions/generate.js", "vercel.json"],
                related: ["lib-generate", "vercel", "app", "templates"]
            },
            samples: {
                title: "samples.mjs",
                path: "api/samples.mjs",
                body: `
                    <p><code>GET /api/samples</code>. returns the preset list from <code>lib/compositions/templates.js</code> (fingerprints, coffee, tree, roses, little prince).</p>
                `,
                also: ["lib/compositions/templates.js"],
                related: ["templates", "app", "vercel"]
            },
            health: {
                title: "health.mjs",
                path: "api/health.mjs",
                body: `
                    <p><code>GET /api/health</code>. returns <code>{ ok: true }</code>.</p>
                `,
                also: ["vercel.json"],
                related: ["vercel"]
            },
            "lib-generate": {
                title: "generate.js",
                path: "lib/compositions/generate.js",
                body: `
                    <p>if the request has a <code>sampleId</code>, returns that template. otherwise calls grok, anthropic, or openai, then <code>extractPaintFunction()</code> and <code>assertSafeSketch()</code>.</p>
                `,
                also: ["lib/compositions/prompt.js", "lib/compositions/templates.js", "api/generate.mjs"],
                related: ["generate", "prompt", "templates"]
            },
            prompt: {
                title: "prompt.js",
                path: "lib/compositions/prompt.js",
                body: `
                    <p><code>SYSTEM_PROMPT</code>, <code>userPrompt()</code>, allowed brush names, and <code>CANVAS_SIZE = 800</code>.</p>
                `,
                also: ["lib/compositions/generate.js"],
                related: ["lib-generate"]
            },
            templates: {
                title: "templates.js",
                path: "lib/compositions/templates.js",
                body: `
                    <p>the preset scenes and their stored <code>paint()</code> functions. used by <code>api/samples.mjs</code> and by generate when you tap a chip.</p>
                `,
                also: ["api/samples.mjs", "lib/compositions/generate.js"],
                related: ["samples", "lib-generate", "app"]
            },
            "add-photo": {
                title: "add_photo.py",
                path: "scripts/add_photo.py",
                body: `
                    <p>mac script: resize a jpeg with <code>sips</code>, prepend a row to <code>snaps.json</code>, commit with <code>gh</code>. <code>build_photo_app.py</code> and the install shells wrap it as a drop target.</p>
                `,
                also: [
                    "scripts/build_photo_app.py",
                    "scripts/build_photo_shortcut.py",
                    "scripts/install_photo_shortcut.sh",
                    "snaps.json"
                ],
                related: ["snaps", "photos", "ios-photo", "docs-photos"]
            },
            "add-bookmark": {
                title: "add_bookmark.py",
                path: "scripts/add_bookmark.py",
                body: `
                    <p>mac script: fetch the page title, prepend to <code>bookmarks.json</code>, commit with <code>gh</code>. the share-sheet builder is <code>build_share_shortcut.py</code>.</p>
                `,
                also: [
                    "scripts/build_share_shortcut.py",
                    "scripts/install_share_shortcut.sh",
                    "bookmarks.json"
                ],
                related: ["bookmarks", "ios-bookmark", "docs-bookmarks"]
            },
            "ios-photo": {
                title: "ios-merge-photo.js",
                path: "shortcuts/ios-merge-photo.js",
                body: `
                    <p>the “run javascript” step in the iphone shortcut. merges a new photo into <code>snaps.json</code> through the github contents api, because the mac python script is not on the phone.</p>
                `,
                also: ["shortcuts/", "snaps.json", "docs/add-photos.md"],
                related: ["add-photo", "snaps", "docs-photos"]
            },
            "ios-bookmark": {
                title: "ios-merge-bookmark.js",
                path: "shortcuts/ios-merge-bookmark.js",
                body: `
                    <p>same as the photo merge, for <code>bookmarks.json</code>.</p>
                `,
                also: ["shortcuts/", "bookmarks.json", "docs/add-bookmarks.md"],
                related: ["add-bookmark", "bookmarks", "docs-bookmarks"]
            },
            "docs-photos": {
                title: "add-photos.md",
                path: "docs/add-photos.md",
                body: `
                    <p>how to add a photo: the mac app, the iphone shortcut, and the shape of a <code>snaps.json</code> entry.</p>
                `,
                also: ["scripts/add_photo.py", "shortcuts/ios-merge-photo.js", "snaps.json"],
                related: ["add-photo", "ios-photo", "snaps"]
            },
            "docs-bookmarks": {
                title: "add-bookmarks.md",
                path: "docs/add-bookmarks.md",
                body: `
                    <p>how to add a bookmark from safari, plus the <code>bookmarks.json</code> fields.</p>
                `,
                also: ["scripts/add_bookmark.py", "shortcuts/ios-merge-bookmark.js", "bookmarks.json"],
                related: ["add-bookmark", "ios-bookmark", "bookmarks"]
            }
        };

        const atlas = document.getElementById("atlas");
        const dossier = document.getElementById("dossier");
        const dossierTitle = document.getElementById("dossierTitle");
        const dossierBody = document.getElementById("dossierBody");
        const buttons = {};

        tree.forEach((dir) => {
            const block = document.createElement("div");
            block.className = "dir";
            const label = document.createElement("p");
            label.className = "dir-path";
            label.textContent = dir.path;
            const row = document.createElement("div");
            row.className = "dir-files";
            dir.nodes.forEach((id) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "node";
                button.id = `node-${id}`;
                button.dataset.id = id;
                button.textContent = files[id].title;
                button.addEventListener("click", () => openNode(id));
                buttons[id] = button;
                row.append(button);
            });
            block.append(label, row);
            atlas.append(block);
        });

        function openNode(id) {
            const entry = files[id];
            if (!entry) return;

            const already = buttons[id].classList.contains("is-open");
            Object.values(buttons).forEach((button) => button.classList.remove("is-open", "is-related"));

            if (already) {
                dossier.hidden = true;
                history.replaceState(null, "", "architecture.html");
                return;
            }

            buttons[id].classList.add("is-open");
            entry.related.forEach((other) => buttons[other]?.classList.add("is-related"));

            dossierTitle.textContent = entry.path;
            const also = entry.also.length
                ? `<ul class="files">${entry.also.map((file) => `<li>${file}</li>`).join("")}</ul>`
                : "";
            const links = `<div class="related">${entry.related.map((other) =>
                `<button type="button" data-jump="${other}">${files[other].path}</button>`
            ).join("")}</div>`;
            dossierBody.innerHTML = `${entry.body}${also}${links}`;
            dossierBody.querySelectorAll("[data-jump]").forEach((button) => {
                button.addEventListener("click", () => openNode(button.dataset.jump));
            });
            dossier.hidden = false;
            history.replaceState(null, "", `#${id}`);
        }

        const start = aliases[location.hash.slice(1)] || location.hash.slice(1);
        if (files[start]) openNode(start);
        else openNode("index");
    </script>
</body>
</html>
