<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffefa">
  <title>explorations · compositions</title>
  <meta name="description" content="Painted explorations from Compositions.">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="site-head">
    <div>
      <a class="back" href="/compositions/">← compositions</a>
      <h1>explorations</h1>
    </div>
    <span class="intro">paintings from the studio</span>
  </header>
  <main>
    <div class="controls">
      <div class="view-switch" aria-label="Collection">
        <button type="button" data-limit="10" aria-pressed="true">latest 10</button>
        <button type="button" data-limit="all" aria-pressed="false">all paintings</button>
      </div>
      <div class="model-filter"><span>by</span><div class="model-picker">
        <button id="model-trigger" class="model-trigger" type="button" aria-label="Models: sol and astra" aria-haspopup="true" aria-controls="model-menu" aria-expanded="false"><span id="model-current">sol + astra</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg></button>
        <div id="model-menu" class="model-menu" role="group" aria-label="Models" hidden><label class="model-option"><input type="checkbox" value="Sol" checked>sol</label><label class="model-option"><input type="checkbox" value="Astra" checked>astra</label><label class="model-option"><input type="checkbox" value="Terra">terra</label></div>
      </div></div>
      <span id="count" aria-live="polite"></span>
    </div>
    <section id="grid" class="grid" aria-label="Paintings"></section>
  </main>
  <dialog id="detail" aria-label="Painting">
    <button id="close" type="button" aria-label="Close painting">×</button>
    <img id="large" alt="">
    <div class="detail-copy"><span id="detail-model"></span><h2 id="detail-title"></h2></div>
  </dialog>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
